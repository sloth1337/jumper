<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Frippelito</title>
    <style>
        body {
            margin: 0;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            background: #87CEEB; /* Himmelsblå bakgrund */
            border: 4px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);

    touch-action: none; 
    overflow: hidden;

        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Spelinställningar
let gravity = 0.6;
let score = 0;
let gameOver = false;
let gameActive = false; 
let gameWon = false;

// Variabler för jätte-Santa vid Game Over
let gameOverObstacle = {
    x: canvas.width,
    y: 100,
    width: 150,
    height: 100,
    targetWidth: 300,  // Hur brett det ska bli till slut
    targetHeight: 200, // Hur högt det ska bli till slut
    targetX: canvas.width / 2 - 150, // Mitten av skärmen
    targetY: canvas.height / 2 - 100
};

// --- LADDA IN BILDER OCH MUSIK ---
const playerImage = new Image();
playerImage.src = "img/frippe.png"; 

const obstacleImage = new Image();
obstacleImage.src = "img/linander.png"; 

const cloudImage = new Image();
cloudImage.src = "img/moln.webp"; 

const object2Image = new Image();
object2Image.src = "img/rum.webp"; 

const winImage = new Image();
winImage.src = "img/vinst.png";

function playCorrectSound() {
const sound = new Audio("mp3/correct.mp3");
sound.play();
}

function playGameOverSound() {
const sound = new Audio("mp3/gameover.mp3");
sound.play();
}

function playWinSound() {
const sound = new Audio("mp3/win.mp3");
sound.play();
}

const bgMusic = new Audio("mp3/musik.mp3"); 
bgMusic.loop = true;                    
bgMusic.volume = 0.3;    

const winMusic = new Audio("mp3/winner.mp3");
winMusic.loop = true;
winMusic.volume = 0.4;

// Spelfigurens storlek och placering
let player = {
    x: 50,
    y: 220, 
    width: 100,
    height: 120,
    velocityY: 0,
    jumpForce: -18,
    isGrounded: false
};

// Hindrets storlek och placering (Mark-hindret)
let obstacle = {
    x: canvas.width,
    y: 240,       
    width: 150,    
    height: 100,   
    speed: 6
};

// Molnens storlek, placering och hastighet
let clouds = [
    { x: canvas.width + 50,  y: 40,  width: 120, height: 60, speed: 1 },
    { x: canvas.width + 400, y: 100, width: 100, height: 50, speed: 1.2 },
    { x: canvas.width + 750, y: 60,  width: 140, height: 70, speed: 0.8 }
];

// Det flygande objektets inställningar
let object2 = {
    x: canvas.width + 300, 
    y: 120,                
    width: 20,             
    height: 45,            
    speed: 8,
    isCaught: false        
};

// Kunna starta om efter vinst
let canRestart = true;

// Tangentbords-funktioner eller touch

function handleGameInput(inputSource) {

    if (inputSource === "Enter" || inputSource === "Touch") {

        if (!gameActive && !gameOver && !gameWon) {
            gameActive = true; 
            bgMusic.play(); 
            return;
        } 

        else if (gameOver || gameWon) {
            if (canRestart) {
                restartGame(); 
            }
            return; 
        }
    }
    
    if (inputSource === "Space" || inputSource === "Touch") {
        if (gameActive && !gameOver && !gameWon) {
            jump();
        }
    }
}

// Lyssna efter tangenter på datorn 

window.addEventListener("keydown", function(e) {
    if (e.code === "Enter") {
        handleGameInput("Enter");
    }
    if (e.code === "Space") {
        e.preventDefault(); 
        handleGameInput("Space");
    }
});

// Lyssna efter Touch (för smartphone och surfplattor)

window.addEventListener("touchstart", function(e) {

// Förhindrar att skärmen zoomar eller scrollar av misstag när man trycker snabbt
    e.preventDefault(); 
    
    handleGameInput("Touch");
}, { passive: false });
function jump() {
    if (player.isGrounded) {
        player.velocityY = player.jumpForce;
        player.isGrounded = false;
    }
}

// Slut på tangentbord och touch


function restartGame() {
    obstacle.x = canvas.width;
    obstacle.speed = 6;
    
    object2.x = canvas.width + 300;
    object2.speed = 8;
    object2.isCaught = false;

    winMusic.pause();

    gameOverObstacle.x = canvas.width;
    gameOverObstacle.width = 150;
    gameOverObstacle.height = 100;
    gameOverObstacle.y = 100;

    clouds.forEach(function(c, index) {
        c.x = canvas.width + (index * 350); 
    });
    
    score = 0;
    gameOver = false;
    gameWon = false;
    gameActive = true; 
    player.y = 220; 
    player.velocityY = 0;

    bgMusic.currentTime = 0;
    bgMusic.play();
}
function gameLoop() {
    
// OM SPELET ÄR VUNNIT: Visa vinstskärmen direkt och stoppa här

    if (gameWon) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(46, 204, 113, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

// Mått för vinstbild
        let bigFrippeW = 150;
        let bigFrippeH = 250;
        let bigFrippeX = canvas.width / 2 - bigFrippeW / 2;
        let bigFrippeY = canvas.height / 2 - bigFrippeH / 2 + 20;

// Rita ut vinstbild (winImage)
        try {
            ctx.drawImage(winImage, bigFrippeX, bigFrippeY, bigFrippeW, bigFrippeH);
        } catch(e) {
            ctx.fillStyle = "#FFD700"; 
            ctx.fillRect(bigFrippeX, bigFrippeY, bigFrippeW, bigFrippeH);
        }

// RITA SEGER-PRATBUBBLA
        let winBubbleX = canvas.width / 2;
        let winBubbleY = bigFrippeY - 40;

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.roundRect(winBubbleX - 120, winBubbleY - 35, 240, 50, 15);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(winBubbleX, winBubbleY + 15);
        ctx.lineTo(winBubbleX - 10, winBubbleY + 15);
        ctx.lineTo(winBubbleX, winBubbleY + 25);
        ctx.fill();

        ctx.fillStyle = "black";
        ctx.textAlign = "center";
        ctx.font = "bold 16px Arial";
        ctx.fillText("CUBA LIBRE!", winBubbleX, winBubbleY - 3);

// Vinst
        ctx.fillStyle = "white";
        ctx.font = "bold 40px Arial";
        ctx.fillText("DU VANN!", canvas.width / 2, canvas.height / 2 + 140);
        ctx.font = "20px Arial";
        ctx.fillText("(3 sec delay) Tryck ENTER (touch) för ny omgång", canvas.width / 2, canvas.height / 2 + 175);

        requestAnimationFrame(gameLoop);
        return; 
    }

// OM DET ÄR GAME OVER: Visa El Santa och pratbubblan
    if (gameOver) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

// Animera jätte-Santa
        if (gameOverObstacle.x > gameOverObstacle.targetX) gameOverObstacle.x -= 10;
        if (gameOverObstacle.x < gameOverObstacle.targetX) gameOverObstacle.x += 10;
        if (gameOverObstacle.y > gameOverObstacle.targetY) gameOverObstacle.y -= 5;
        
        if (gameOverObstacle.width < gameOverObstacle.targetWidth) gameOverObstacle.width += 4;
        if (gameOverObstacle.height < gameOverObstacle.targetHeight) gameOverObstacle.height += 3;

        try {
            ctx.drawImage(obstacleImage, gameOverObstacle.x, gameOverObstacle.y, gameOverObstacle.width, gameOverObstacle.height);
        } catch(e) {
            ctx.fillStyle = "#2C3E50";
            ctx.fillRect(gameOverObstacle.x, gameOverObstacle.y, gameOverObstacle.width, gameOverObstacle.height);
        }

// El Santas pratbubbla
        if (Math.abs(gameOverObstacle.x - gameOverObstacle.targetX) < 20) {
            let bubbleX = canvas.width / 2;
            let bubbleY = gameOverObstacle.y - 40;

            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.roundRect(bubbleX - 120, bubbleY - 35, 240, 50, 15);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(bubbleX, bubbleY + 15);
            ctx.lineTo(bubbleX - 10, bubbleY + 15);
            ctx.lineTo(bubbleX, bubbleY + 25);
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.font = "bold 16px Arial";
            ctx.fillText("No more RUM for you!", bubbleX, bubbleY - 3);
        }
        
// Game Over
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 40px Arial";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 + 130);
        ctx.font = "20px Arial";
        ctx.fillText("Tryck på ENTER (touch) för att starta om", canvas.width / 2, canvas.height / 2 + 160);

        requestAnimationFrame(gameLoop);
        return; 
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

// --- RITA ALLA MOLN ---
    clouds.forEach(function(c) {
        if (gameActive) {
            c.x -= c.speed;
            if (c.x + c.width < 0) {
                c.x = canvas.width + Math.random() * 200; 
                c.y = 30 + Math.random() * 80;            
            }
        }
        try {
            ctx.drawImage(cloudImage, c.x, c.y, c.width, c.height);
        } catch(e) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.fillRect(c.x, c.y, c.width, c.height);
        }
    });

// --- RITA MARKEN ---
    ctx.fillStyle = "#8B5A2B";
    ctx.fillRect(0, 340, canvas.width, 60);

    // --- RITA UT FRIPPE ---
    try {
        ctx.drawImage(playerImage, player.x, player.y, player.width, player.height);
    } catch(e) {
        ctx.fillStyle = "#FF5733";
        ctx.fillRect(player.x, player.y, player.width, player.height);
    }

// --- LOGIK FÖR AKTIVT SPEL ---
    if (gameActive) {
        player.velocityY += gravity;
        player.y += player.velocityY;

        if (player.y >= 220) {
            player.y = 220;
            player.velocityY = 0;
            player.isGrounded = true;
        }

// Flytta mark-hindret
        obstacle.x -= obstacle.speed;
        if (obstacle.x + obstacle.width < 0) {
            obstacle.x = canvas.width;
            obstacle.speed += 0.3; 
        }

// Flytta det flygande objektet
        object2.x -= object2.speed;
        if (object2.x + object2.width < 0) {
            object2.x = canvas.width + Math.random() * 400;
            object2.speed = obstacle.speed + 2; 
            object2.isCaught = false; 
        }

// Kollision med poäng-objektet (Fånga drinken)
        if (
            !object2.isCaught &&
            player.x < object2.x + object2.width &&
            player.x + player.width > object2.x &&
            player.y < object2.y + object2.height &&
            player.y + player.height > object2.y
        ) {
            score += 1;
            object2.isCaught = true; 
            playCorrectSound(); 

            if (score >= 13) {
                gameWon = true;
                bgMusic.pause(); 
                playWinSound(); 
                winMusic.currentTime = 0; // Spolar till början
                winMusic.play(); 

// Fördröjning efter vinnst
canRestart = false; 
setTimeout(function() {
    canRestart = true; 
}, 3000); //millisekunder 1000 är 1 sekund

            }
        }

// KOLLISION MED MARK-HINDRET (MED MINDRE HITBOX)
        let obstaclePaddingX = 20; 
        let obstaclePaddingY = 15; 

        if (
            player.x < (obstacle.x + obstacle.width) - obstaclePaddingX &&
            player.x + player.width > obstacle.x + obstaclePaddingX &&
            player.y < (obstacle.y + obstacle.height) && 
            player.y + player.height > obstacle.y + obstaclePaddingY
        ) {
            gameOver = true;
            bgMusic.pause(); 
            playGameOverSound(); 

            gameOverObstacle.x = obstacle.x;
            gameOverObstacle.y = obstacle.y;
        }
    }

// --- RITA UT HINDRET ---
    try {
        ctx.drawImage(obstacleImage, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    } catch(e) {
        ctx.fillStyle = "#2C3E50";
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    }

// --- RITA UT DET FLYGANDE OBJEKTET ---
    if (!object2.isCaught) {
        try {
            ctx.drawImage(object2Image, object2.x, object2.y, object2.width, object2.height);
        } catch(e) {
            ctx.fillStyle = "#FFD700"; 
            ctx.fillRect(object2.x, object2.y, object2.width, object2.height);
        }
    }

// --- RITA POÄNGEN ---
    ctx.fillStyle = "#333";
    ctx.font = "24px Arial";
    ctx.textAlign = "left"; 

// Siffror efter text ger textens placering
    ctx.fillText("Poäng: " + score, 20, 40);   
    ctx.fillText(" av 13", 130, 40);
    ctx.fillText(" SPACEBAR för att hoppa! Touch för smartphone.", 210, 40);

// --- STARTSKÄRM ---
    if (!gameActive) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        
        ctx.font = "bold 36px Arial";
        ctx.fillText("The Frippelito Adventure", canvas.width / 2, canvas.height / 2 - 40);
        
        ctx.font = "20px Arial";
        ctx.fillText("Hjälp Frippelito fånga 13 rom och cola!", canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("Undvik att bli påkörd av den onde El Santa!", canvas.width / 2, canvas.height / 2 + 35);
        ctx.fillText("Tryck på ENTER (touch) för att starta", canvas.width / 2, canvas.height / 2 + 75);
    }

    requestAnimationFrame(gameLoop);
}

// Starta spel-loopen
gameLoop();
</script>

</body>
</html>
